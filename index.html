<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senbot Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#f5f6fa;color:#1a1a2e;line-height:1.6}
.header{background:linear-gradient(135deg,#1a1a2e,#2E86AB);color:#fff;padding:18px 24px;text-align:center}
.header h1{font-size:20px}.header span{font-size:12px;opacity:.7}
.container{max-width:900px;margin:20px auto;padding:0 16px}
.report{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:20px;overflow:hidden}
.rtitle{padding:14px 20px;font-size:16px;font-weight:700;border-bottom:2px solid #f0f0f0}
.rbody{padding:18px 20px}
h3{font-size:15px;margin:16px 0 8px;color:#2E86AB}
h3:first-child{margin-top:0}
table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0 14px}
th{text-align:left;padding:8px 10px;background:#f0f4f8;border-bottom:2px solid #dde;font-weight:600;color:#555;font-size:11px;text-transform:uppercase}
td{padding:8px 10px;border-bottom:1px solid #f0f0f0}
tr:last-child td{border-bottom:none}
.num{text-align:right;font-weight:600}
.g{color:#27AE60}.r{color:#C0392B}.o{color:#E67E22}.gr{color:#999}
.alert{padding:8px 12px;border-radius:6px;margin:4px 0;font-size:12px}
.ar{background:#ffeaea;color:#C0392B;border-left:3px solid #C0392B}
.ao{background:#fff8ee;color:#E67E22;border-left:3px solid #E67E22}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0}
.split>div{background:#f8f9fb;border-radius:8px;padding:10px 14px;font-size:13px}
.split .good b{color:#27AE60}.split .bad b{color:#C0392B}
.conclusion{background:#f0f7ff;border-left:3px solid #2E86AB;padding:12px 16px;border-radius:6px;margin-top:12px;font-size:13px}
.empty{text-align:center;padding:40px;color:#999}
.small{font-size:12px;color:#888}
</style>
</head>
<body>
<div class="header"><h1>📊 Senbot Dashboard</h1><span id="t">Đang tải...</span></div>
<div class="container" id="app"><div class="empty">⏳ Đang tải...</div></div>

<script>
function fm(v){if(!v||v===0)return'—';v=Math.round(v);if(v>=1e9)return(v/1e9).toFixed(2)+' tỷ';if(v>=1e6)return Math.round(v/1e6)+'M';return v.toLocaleString()+'đ'}

function tbl(hd,rows){
  var h='<table>';
  if(hd&&hd.length)h+='<tr>'+hd.map(function(x){return'<th>'+x+'</th>'}).join('')+'</tr>';
  if(rows)for(var i=0;i<rows.length;i++){
    var r=rows[i];
    if(!r||r.length===0)continue;
    if(r[0]===null){h+='<tr><td colspan="99"><hr style="margin:0;border:none;border-top:1px dashed #ddd"></td></tr>';continue}
    h+='<tr>'+r.map(function(x,j){return'<td'+(j>0?' class="num"':'')+'>'+(x||'')+'</td>'}).join('')+'</tr>';
  }
  return h+'</table>';
}

function renderSection(d){
  if(!d||!d.type)return'';
  var h='<div class="report"><div class="rtitle">'+ (d.title||'') +'</div><div class="rbody">';

  // KPI cards
  if(d.kpis&&d.kpis.length){
    h+='<div class="split">';
    for(var i=0;i<d.kpis.length;i++){
      var k=d.kpis[i],cl='';
      if(k.up)cl='g';else if(k.down)cl='r';
      h+='<div><div style="font-size:22px;font-weight:700" class="'+cl+'">'+k.val+'</div><div class="small">'+k.label+'</div></div>';
    }
    h+='</div>';
  }

  // Tables
  if(d.tables)for(var ti=0;ti<d.tables.length;ti++){
    var t=d.tables[ti];
    if(t.title)h+='<h3>'+t.title+'</h3>';
    h+=tbl(t.headers,t.rows);
  }

  // Good/Bad
  if(d.good||d.bad){
    h+='<div class="split">';
    if(d.good&&d.good.length)h+='<div class="good"><b>✅ Mặt tốt</b><br>'+d.good.map(function(x){return'• '+x}).join('<br>')+'</div>';
    if(d.bad&&d.bad.length)h+='<div class="bad"><b>❌ Cần cải thiện</b><br>'+d.bad.map(function(x){return'• '+x}).join('<br>')+'</div>';
    h+='</div>';
  }

  // Self note
  if(d.note)h+='<div class="split"><div>💬 <b>Tự nhận xét:</b><br>👍 '+(d.note.good||'—')+'<br>👎 '+(d.note.bad||'—')+'</div></div>';

  // Alerts
  if(d.alerts)for(var ai=0;ai<d.alerts.length;ai++){
    var a=d.alerts[ai],cls=a.level==='red'?'ar':(a.level==='orange'?'ao':'');
    h+='<div class="alert '+cls+'">'+(a.icon||'')+' '+a.msg+'</div>';
  }

  // Conclusion
  if(d.conclusion)h+='<div class="conclusion">📌 <b>Kết luận:</b> '+d.conclusion+'</div>';

  h+='</div></div>';
  return h;
}

fetch('data.json').then(function(r){return r.json()}).then(function(d){
  document.getElementById('t').textContent='Cập nhật: '+(d.updated||'—');
  var h='';
  if(d.sections)for(var i=0;i<d.sections.length;i++)h+=renderSection(d.sections[i]);
  document.getElementById('app').innerHTML=h||'<div class="empty">📭 Chưa có dữ liệu</div>';
}).catch(function(e){
  document.getElementById('app').innerHTML='<div class="empty">❌ Lỗi: '+e.message+'</div>';
});
</script>
</body>
</html>
